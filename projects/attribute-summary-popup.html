<!-- Copy Attributes modal overlay (position:absolute covers entire popup) -->
<div id="asCopyModal" class="rf-weights-modal-overlay" style="display:none;" role="dialog" aria-modal="true">
  <div class="rf-weights-modal-box as-copy-modal-box">
    <div id="asCopyModalTitle" class="rf-weights-modal-title">Copy Attributes</div>

    <div id="asCopyModalBody"></div>

    <div class="rf-weights-modal-actions">
      <span style="flex:1;"></span>
      <button id="asCopyCancelBtn" class="rf-btn-sm" type="button">Cancel</button>
      <button id="asCopyApplyBtn" class="rf-action-primary" type="button" style="width:auto;padding:5px 16px;" disabled>Apply</button>
    </div>
  </div>
</div>

<div class="as-root">
  <div class="as-intro">
    Edit attributes for every drawn feature in one place. Changes save automatically.
  </div>

  <div class="as-empty" id="asEmpty" style="display:none">
    No features have been drawn yet. Add points, lines, routes, polygons, text boxes, or labels from the toolbar to populate this view.
  </div>

  <div class="as-section" data-section="point" style="display:none">
    <div class="as-section-header">Points</div>
    <div class="as-table" id="asPointsTable"></div>
  </div>

  <div class="as-section" data-section="line" style="display:none">
    <div class="as-section-header">Lines</div>
    <div class="as-table" id="asLinesTable"></div>
  </div>

  <div class="as-section" data-section="route" style="display:none">
    <div class="as-section-header">Routes</div>
    <div class="as-table" id="asRoutesTable"></div>
  </div>

  <div class="as-section" data-section="polygon" style="display:none">
    <div class="as-section-header">Polygons</div>
    <div class="as-table" id="asPolygonsTable"></div>
  </div>

  <div class="as-section" data-section="textbox" style="display:none">
    <div class="as-section-header">Text Boxes</div>
    <div class="as-table" id="asTextboxesTable"></div>
  </div>

  <div class="as-section" data-section="label" style="display:none">
    <div class="as-section-header">Labels</div>
    <div class="as-table" id="asLabelsTable"></div>
  </div>
</div>
