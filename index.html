<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Casey's Analysis Tool</title>

    <!-- MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <!-- Turf.js -->
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

    <!-- pako for gzip inflate (LODES CSV.GZ) -->
    <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>

    <!-- PapaParse for robust CSV parsing (handles quoted commas) -->
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

    <!-- App styles -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar-v2.css" />

    <!-- Open Sans for map labels -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="app">
      <div id="toolbar">
        <div id="draw-tools">
          <button class="tool-btn" data-mode="station" title="Station">
            <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="#3182ce"/></svg>
          </button>
          <button class="tool-btn" data-mode="line" title="Line">
            <svg width="22" height="22" viewBox="0 0 24 24"><line x1="4" y1="19" x2="20" y2="5" stroke="#eab308" stroke-width="3.5" stroke-linecap="round"/></svg>
          </button>
          <button class="tool-btn" data-mode="route" title="Route">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 18c0-3 2-4 5-4s5-1 5-4" stroke="#22a352" stroke-width="2.5" stroke-linecap="round"/><circle cx="6" cy="18" r="2.5" fill="#22a352"/><rect x="14" y="4" width="6" height="5" rx="1" fill="#22a352"/><circle cx="16" cy="6.5" r="1" fill="white"/><circle cx="18.5" cy="6.5" r="1" fill="white"/></svg>
          </button>
          <button class="tool-btn" data-mode="polygon" title="Polygon">
            <svg width="22" height="22" viewBox="0 0 24 24"><polygon points="12,4 21,10 18,20 6,20 3,10" fill="#f97316"/></svg>
          </button>
          <button class="tool-btn" data-mode="label" title="Label">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 5h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4 3.5V16H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="#e53e3e"/></svg>
          </button>
        </div>
        <div id="draw-actions">
          <button id="undo" title="Delete Last">
            <svg width="22" height="22" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="4" fill="#2d3748"/><line x1="9" y1="9.5" x2="15" y2="15.5" stroke="white" stroke-width="2.5" stroke-linecap="round"/><line x1="15" y1="9.5" x2="9" y2="15.5" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
          <button id="clear" title="Clear">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3182ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M5 6l1 14h12l1-14"/><path d="M10 10v7"/><path d="M14 10v7"/></svg>
          </button>
          <button id="reset" class="reset-btn" title="Reset Session">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4.5 12a7.5 7.5 0 0 1 13-5.1l1.5-1.5" stroke="#e53e3e" stroke-width="2.5" stroke-linecap="round"/><path d="M19.5 12a7.5 7.5 0 0 1-13 5.1l-1.5 1.5" stroke="#e53e3e" stroke-width="2.5" stroke-linecap="round"/><polygon points="19,2 22,5.5 18,6" fill="#e53e3e"/><polygon points="5,22 2,18.5 6,18" fill="#e53e3e"/><line x1="12" y1="9" x2="12" y2="13" stroke="#e53e3e" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="16" r="1.3" fill="#e53e3e"/></svg>
          </button>
        </div>
      </div>

      <div id="main-content">
      <div id="sidebar"></div>

      <div id="map"></div>

      <div id="feature-panel">
        <button id="fp-collapse-btn" title="Hide panel" aria-label="Toggle feature panel">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <div class="fp-header">
          <h3>Features</h3>
        </div>
        <div class="fp-content">

          <div class="fp-section">
            <div class="fp-section-header">Stations</div>
            <div id="fp-stations" class="fp-list"></div>
          </div>

          <div class="fp-section">
            <div class="fp-section-header">Lines</div>
            <div id="fp-lines" class="fp-list"></div>
          </div>

          <div class="fp-section">
            <div class="fp-section-header">Routes</div>
            <div id="fp-routes" class="fp-list"></div>
          </div>

          <div class="fp-section">
            <div class="fp-section-header">Polygons</div>
            <div id="fp-polygons" class="fp-list"></div>
          </div>

          <div class="fp-section">
            <div class="fp-section-header">Labels</div>
            <div id="fp-labels" class="fp-list"></div>
          </div>

          <div class="fp-section">
            <div class="fp-section-header">Buffers and Line Width</div>
            <div class="fp-buffer-row">
              <span class="fp-buffer-label">Stations</span>
              <input id="bufferRadius" type="number" min="0" step="0.1" value="0.5" class="fp-radius-input" />
              <span class="fp-radius-unit">mi</span>
              <input id="stationLineWidth" type="number" min="1" max="5" step="0.1" value="1" class="fp-radius-input" />
              <span class="fp-radius-unit">×</span>
            </div>
            <div class="fp-buffer-row">
              <span class="fp-buffer-label">Lines</span>
              <input id="lineBufferRadius" type="number" min="0" step="0.1" value="0.5" class="fp-radius-input" />
              <span class="fp-radius-unit">mi</span>
              <input id="lineLineWidth" type="number" min="1" max="5" step="0.1" value="1" class="fp-radius-input" />
              <span class="fp-radius-unit">×</span>
            </div>
            <div class="fp-buffer-row">
              <span class="fp-buffer-label">Routes</span>
              <input id="routeBufferRadius" type="number" min="0" step="0.1" value="0.5" class="fp-radius-input" />
              <span class="fp-radius-unit">mi</span>
              <input id="routeLineWidth" type="number" min="1" max="5" step="0.1" value="1" class="fp-radius-input" />
              <span class="fp-radius-unit">×</span>
            </div>
            <div class="fp-buffer-row">
              <span class="fp-buffer-label">Polygons</span>
              <input id="polygonLineWidth" type="number" min="1" max="5" step="0.1" value="1" class="fp-radius-input" />
              <span class="fp-radius-unit">×</span>
            </div>
            <div class="fp-buffer-row">
              <label class="fp-buffer-label" for="offsetOverlap">
                <input type="checkbox" id="offsetOverlap" /> Offset overlapping Lines/Routes
              </label>
            </div>
          </div>
        </div>

        <div class="fp-actions">
          <button id="fp-import">Import</button>
          <button id="fp-export">Export</button>
        </div>
        <input type="file" id="fp-import-file" accept=".json" style="display:none" />
      </div>
      </div><!-- #main-content -->

      <!-- Analysis module popup (generic container, reused per-module) -->
      <div id="module-popup" class="module-popup" style="display:none;">
        <div class="module-popup-backdrop"></div>
        <div class="module-popup-dialog">
          <div class="module-popup-header">
            <h3 class="module-popup-title"></h3>
            <button class="module-popup-close" aria-label="Close">&times;</button>
          </div>
          <div class="module-popup-body"></div>
        </div>
      </div>
    </div>

    <!-- Core modules (order matters) -->
    <script src="js/core/utils.js"></script>
    <script src="js/core/sidebar.js"></script>
    <script src="js/core/map.js"></script>
    <script src="js/core/stations.js"></script>
    <script src="js/core/lines.js"></script>
    <script src="js/core/routes.js"></script>
    <script src="js/core/polygons.js"></script>
    <script src="js/core/labels.js"></script>
    <script src="js/core/editing.js"></script>
    <script src="js/core/selection.js"></script>
    <script src="js/core/features.js"></script>
    <script src="js/core/feature-attributes.js"></script>
    <script src="js/core/census.js"></script>
    <script src="js/core/lodes.js"></script>
    <script src="js/core/projections.js"></script>
    <script src="js/core/cache.js"></script>
    <script src="js/core/popup.js"></script>
    <script src="js/app.js"></script>

    <!-- Analysis modules (all load simultaneously; disabled modules show grayed-out buttons) -->
    <script src="js/projects/buffer-summary.js"></script>
    <script src="js/projects/fta-small-starts.js"></script>
    <script src="js/projects/tpi-scoring.js"></script>
    <script src="js/projects/transit-propensity.js"></script>
    <script src="js/projects/ridership-scoring.js"></script>
    <script src="js/projects/ridership-forecasting.js"></script>
    <script src="js/projects/title-vi-engine.js"></script>
    <script src="js/projects/title-vi.js"></script>
  </body>
</html>
